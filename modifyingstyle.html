<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id ="heading">welcome</h1>
    <button onclick="changebgc()">changebackground</button>
    <button onclick="font()">change font</button>
    <button onclick="textcolor()">text color</button>

        function changebgc(){
            document.body.style.backgroundColor="red";
                }
                function font(){
                    document.getElementById("heading").style.fontFamily="algerian"
                }
                function textcolor(){
                    document.getElementById("heading").style.color="pink"
                }
    </script>
</body>
